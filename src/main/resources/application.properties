# ==============================================================
# College Placement Management System - Main Configuration
# ==============================================================
server.port=8080
server.servlet.context-path=

# Spring Application Name
spring.application.name=placement-management-system

# Active Profile: 'dev' for persistent embedded MySQL mode; switch to 'mysql' for local/production MySQL server
spring.profiles.active=dev

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/resumes

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# JPA & Hibernate General Settings
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.college.placement=INFO
logging.level.org.springframework.security=WARN
