<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#content})}">
<head>
    <title>Notifications - College Placement System</title>
</head>
<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">Notifications & Alerts</h3>
            <p class="text-muted small mb-0">Campus announcements, application stage progressions, and interview schedules.</p>
        </div>
        <form th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-check2-all me-1"></i> Mark All as Read
            </button>
        </form>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <ul class="list-group list-group-flush">
                <li class="list-group-item p-4 d-flex justify-content-between align-items-start"
                    th:each="n : ${notifications}"
                    th:classappend="${!n.readStatus} ? 'bg-light' : ''">
                    <div class="d-flex gap-3">
                        <div class="pt-1">
                            <i class="bi fs-4" th:classappend="${!n.readStatus} ? 'bi-bell-fill text-primary' : 'bi-bell text-secondary'"></i>
                        </div>
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <h6 class="fw-bold text-dark mb-0" th:text="${n.title}">Notification Title</h6>
                                <span th:if="${!n.readStatus}" class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.7rem;">NEW</span>
                            </div>
                            <p class="text-secondary small mb-2" th:text="${n.message}">Notification message details...</p>
                            <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</small>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <a th:if="${n.link != null && !n.link.isBlank()}" th:href="${n.link}" class="btn btn-outline-primary btn-sm">
                            View <i class="bi bi-arrow-right"></i>
                        </a>
                        <form th:if="${!n.readStatus}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                            <button type="submit" class="btn btn-light btn-sm border" title="Mark as Read">
                                <i class="bi bi-check"></i>
                            </button>
                        </form>
                    </div>
                </li>
                <li class="list-group-item p-5 text-center text-muted" th:if="${notifications == null || notifications.isEmpty()}">
                    <i class="bi bi-bell-slash fs-1 text-secondary d-block mb-2"></i>
                    <h6>No notifications at this time</h6>
                    <span class="small">You are all caught up with your campus placement activities.</span>
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
