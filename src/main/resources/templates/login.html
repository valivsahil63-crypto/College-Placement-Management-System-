<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - College Placement Management System</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container" style="max-width: 520px;">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded p-3 mb-2 shadow-sm">
                    <i class="bi bi-mortarboard-fill fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-0">Placement Portal</h3>
                <p class="text-muted small">Campus Recruitment Management System</p>
            </a>
        </div>

        <div class="card shadow-sm border rounded-3">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold text-dark mb-1">Account Login</h4>
                <p class="text-muted small mb-4">Sign in with your registered college credentials</p>

                <!-- Feedback messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                    <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}">Success</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">College Email / Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="username" name="username" placeholder="name@college.edu" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                    </button>
                </form>

                <!-- Viva / Quick Demo Account Switcher -->
                <div class="mt-4 pt-3 border-top">
                    <label class="form-label small text-muted fw-semibold mb-2">
                        <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins (Viva Mode):
                    </label>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="fillCredentials('admin@college.edu', 'Admin@123')">
                            Admin
                        </button>
                        <button type="button" class="btn btn-outline-info btn-sm" onclick="fillCredentials('officer@college.edu', 'Officer@123')">
                            Placement Officer
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="fillCredentials('rahul.sharma@college.edu', 'Student@123')">
                            Student (Rahul)
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm" onclick="fillCredentials('sneha.rao@college.edu', 'Student@123')">
                            Student (Placed)
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">New student? <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Register here</a></p>
                    <p class="small text-muted mt-2 mb-2"><a th:href="@{/}" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> Return to Homepage</a></p>
                    <div class="small text-muted d-flex justify-content-center gap-2">
                        <a th:href="@{/privacy-policy}" class="text-muted text-decoration-none">Privacy Policy</a>
                        <span>|</span>
                        <a th:href="@{/terms-and-conditions}" class="text-muted text-decoration-none">Terms and Conditions</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
