<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#content})}">
<head>
    <title th:text="${isEdit ? 'Edit Company' : 'Register Company'}">Company Profile</title>
</head>
<body>
<div id="content">

    <div class="mb-4">
        <a th:href="@{/admin/companies}" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Back to Companies</a>
        <h3 class="fw-bold text-dark mb-1" th:text="${isEdit ? 'Edit Recruiting Partner Profile' : 'Register New Recruiting Partner'}">Company</h3>
        <p class="text-muted small mb-0">Maintain HR contact information, locations, and company overview.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-building-add text-primary me-2"></i> Company Information
                </div>
                <div class="card-body p-4">
                    <form th:action="${isEdit ? '/admin/companies/' + companyDto.id + '/edit' : '/admin/companies/new'}" th:object="${companyDto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Company Name *</label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. Google India" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Industry Sector *</label>
                                <input type="text" class="form-control" th:field="*{industry}" placeholder="e.g. Information Technology / Software" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('industry')}" th:errors="*{industry}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Location (City / State) *</label>
                                <input type="text" class="form-control" th:field="*{location}" placeholder="e.g. Bengaluru, Karnataka" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Website URL</label>
                                <input type="url" class="form-control" th:field="*{website}" placeholder="https://careers.company.com">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">HR Contact Person Name *</label>
                                <input type="text" class="form-control" th:field="*{hrContactName}" placeholder="e.g. Anita Sundaram" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('hrContactName')}" th:errors="*{hrContactName}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">HR Contact Email *</label>
                                <input type="email" class="form-control" th:field="*{hrContactEmail}" placeholder="campus@company.com" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('hrContactEmail')}" th:errors="*{hrContactEmail}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold">HR Contact Phone</label>
                                <input type="text" class="form-control" th:field="*{hrContactPhone}" placeholder="+91 80 1234 5678">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Company Logo Image URL</label>
                            <input type="url" class="form-control" th:field="*{logoUrl}" placeholder="https://domain.com/logo.png">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Company Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Brief background, culture, and business overview..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/companies}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-medium" th:text="${isEdit ? 'Update Company' : 'Save Company'}">
                                Save Company
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
