<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#content})}">
<head>
    <title>Recruiting Partners - College Placement System</title>
</head>
<body>
<div id="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1">Corporate Recruitment Partners</h3>
            <p class="text-muted small mb-0">Browse verified multinational enterprises, startups, and institutions hiring from our campus.</p>
        </div>
        <div sec:authorize="hasAnyRole('ADMIN', 'OFFICER')">
            <a th:href="@{/admin/companies/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i> Add Company
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="company : ${companies}">
            <div class="card h-100 shadow-sm border">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="fw-bold mb-1" th:text="${company.name}">Company Name</h5>
                            <span class="badge bg-light text-dark border" th:text="${company.industry}">Technology</span>
                        </div>
                        <span th:if="${company.active}" class="badge bg-success-subtle text-success">Active Partner</span>
                        <span th:unless="${company.active}" class="badge bg-secondary">Inactive</span>
                    </div>

                    <p class="text-muted small flex-grow-1" th:text="${#strings.abbreviate(company.description, 130)}">Description...</p>

                    <div class="bg-light p-2 rounded small mb-3">
                        <div class="mb-1"><i class="bi bi-geo-alt me-1 text-danger"></i> <span th:text="${company.location}">Location</span></div>
                        <div th:if="${company.website != null && !company.website.isBlank()}">
                            <i class="bi bi-globe me-1 text-primary"></i> <a th:href="${company.website}" target="_blank" class="text-decoration-none" th:text="${company.website}">Website</a>
                        </div>
                    </div>

                    <a th:href="@{'/companies/' + ${company.id}}" class="btn btn-outline-primary btn-sm w-100">
                        View Company Profile & Drives
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
