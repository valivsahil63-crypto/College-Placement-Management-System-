<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403 Forbidden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-4">

    <div class="text-center" style="max-width: 500px;">
        <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-4 mb-3">
            <i class="bi bi-shield-lock-fill fs-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">403 Forbidden</h1>
        <h5 class="fw-semibold text-secondary mb-3">Access Denied</h5>
        <p class="text-muted mb-4">
            You do not have the required role or security permissions to access this administrative resource.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-primary btn-sm px-4">
                <i class="bi bi-house me-1"></i> Return Home
            </a>
            <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm px-4">
                <i class="bi bi-person me-1"></i> Switch Account
            </a>
        </div>
    </div>

</body>
</html>
