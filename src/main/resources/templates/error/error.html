<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - College Placement System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-4">

    <div class="text-center" style="max-width: 520px;">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle p-4 mb-3">
            <i class="bi bi-exclamation-triangle-fill fs-1"></i>
        </div>
        <h1 class="display-6 fw-bold text-dark" th:text="${status != null ? status : 'Error'}">500</h1>
        <h5 class="fw-semibold text-secondary mb-3" th:text="${error != null ? error : 'Application Error'}">Something went wrong</h5>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'An unexpected condition was encountered. Please try again or contact the Placement Cell.'}">
            An unexpected condition was encountered.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary btn-sm px-4">
                <i class="bi bi-arrow-left me-1"></i> Return to Homepage
            </a>
        </div>
    </div>

</body>
</html>
