<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::#content})}">
<head>
    <title>Campus Announcements - College Placement System</title>
</head>
<body>
<div id="content">

    <div class="mb-4">
        <h3 class="fw-bold text-dark mb-1">Campus Placement Announcements</h3>
        <p class="text-muted small mb-0">Broadcast critical recruitment updates, drive registrations, or test reminders to all registered students.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-megaphone-fill text-primary me-2"></i> Compose Announcement
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/officer/announcements}" th:object="${announcementDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Announcement Title *</label>
                            <input type="text" class="form-control" th:field="*{title}" placeholder="e.g. Google Online Coding Test Instructions - 15th Oct" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Detailed Message *</label>
                            <textarea class="form-control" th:field="*{message}" rows="5" placeholder="Enter comprehensive message, instructions, timings, venue details, or test guidelines..." required></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Action Link (Optional)</label>
                            <input type="text" class="form-control" th:field="*{link}" placeholder="e.g. /drives/1 or https://assessment-portal.com">
                            <small class="text-muted">Students clicking the notification in their top bar will be directed to this link.</small>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/officer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-medium">
                                <i class="bi bi-send-fill me-1"></i> Broadcast to All Students
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
