<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - College Placement System</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 820px;">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded p-3 mb-2 shadow-sm">
                    <i class="bi bi-mortarboard-fill fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-0">Student Registration Portal</h3>
                <p class="text-muted small">Campus Placement & Eligibility Verification System</p>
            </a>
        </div>

        <div class="card shadow-sm border rounded-3">
            <div class="card-body p-4 p-md-5">
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                    <!-- Section 1: Account & Credentials -->
                    <h5 class="fw-bold text-primary border-bottom pb-2 mb-3">
                        <i class="bi bi-person-circle me-1"></i> 1. Personal & Account Details
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" th:field="*{fullName}" placeholder="e.g. Rahul Sharma" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">College Email Address *</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="name@college.edu" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password *</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="At least 6 characters" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Re-enter password" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Contact Phone Number *</label>
                            <input type="text" class="form-control" th:field="*{phone}" placeholder="+91 9876543210" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Gender</label>
                            <select class="form-select" th:field="*{gender}">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Section 2: Academic Profile (For Eligibility Engine) -->
                    <h5 class="fw-bold text-primary border-bottom pb-2 mb-3">
                        <i class="bi bi-book me-1"></i> 2. Academic Record (Used for Eligibility Checks)
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">USN / Roll Number *</label>
                            <input type="text" class="form-control" th:field="*{usn}" placeholder="e.g. 1CS21CS045" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('usn')}" th:errors="*{usn}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Branch / Department *</label>
                            <select class="form-select" th:field="*{branch}" required>
                                <option value="">Select Department</option>
                                <option value="CSE">Computer Science & Engineering (CSE)</option>
                                <option value="ISE">Information Science & Engineering (ISE)</option>
                                <option value="ECE">Electronics & Communication (ECE)</option>
                                <option value="MECH">Mechanical Engineering (MECH)</option>
                                <option value="CIVIL">Civil Engineering (CIVIL)</option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Graduation Year *</label>
                            <input type="number" class="form-control" th:field="*{graduationYear}" placeholder="2025" min="2020" max="2035" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('graduationYear')}" th:errors="*{graduationYear}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Current CGPA (0-10) *</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{cgpa}" placeholder="8.50" min="0" max="10" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('cgpa')}" th:errors="*{cgpa}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">10th Percentage (%) *</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{tenthPercentage}" placeholder="85.5" min="0" max="100" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('tenthPercentage')}" th:errors="*{tenthPercentage}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">12th Percentage (%) *</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{twelfthPercentage}" placeholder="82.0" min="0" max="100" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('twelfthPercentage')}" th:errors="*{twelfthPercentage}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Active Backlogs *</label>
                            <input type="number" class="form-control" th:field="*{activeBacklogs}" placeholder="0" min="0" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('activeBacklogs')}" th:errors="*{activeBacklogs}"></div>
                        </div>
                    </div>

                    <!-- Section 3: Technical Skills & Profile -->
                    <h5 class="fw-bold text-primary border-bottom pb-2 mb-3">
                        <i class="bi bi-code-slash me-1"></i> 3. Skills & Online Portfolios
                    </h5>
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Technical Skills</label>
                            <input type="text" class="form-control" th:field="*{skills}" placeholder="e.g. Java, Python, Spring Boot, MySQL, React, AWS">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">LinkedIn Profile URL</label>
                            <input type="url" class="form-control" th:field="*{linkedinUrl}" placeholder="https://linkedin.com/in/username">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">GitHub Profile URL</label>
                            <input type="url" class="form-control" th:field="*{githubUrl}" placeholder="https://github.com/username">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Residential Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="2" placeholder="Permanent or residential address"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Complete Student Registration
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Already registered? <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Sign in here</a></p>
                    <p class="small text-muted mt-2 mb-2"><a th:href="@{/}" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left"></i> Return to Homepage</a></p>
                    <div class="small text-muted d-flex justify-content-center gap-2">
                        <a th:href="@{/privacy-policy}" class="text-muted text-decoration-none">Privacy Policy</a>
                        <span>|</span>
                        <a th:href="@{/terms-and-conditions}" class="text-muted text-decoration-none">Terms and Conditions</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
