version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: placement_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: placement_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: placement_user
      MYSQL_PASSWORD: placement_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placement_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: placement_db
      DB_USER: placement_user
      DB_PASSWORD: placement_secret
      SERVER_PORT: 8080
      APP_UPLOAD_DIR: uploads/resumes
    volumes:
      - app_uploads:/app/uploads

volumes:
  mysql_data:
  app_uploads:
